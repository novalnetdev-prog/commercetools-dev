deployAs:
  - name: enabler
    applicationType: assets
  - name: processor
    applicationType: service
    endpoint: /
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_PROJECT_KEY
          description: "commercetools project key"
          required: true
        - key: CTP_CLIENT_ID
          description: "commercetools client ID with manage_payments, manage_orders, manage_types, view_sessions, view_api_clients, manage_checkout_payment_intents & introspect_oauth_tokens scopes"
          required: true
        - key: CTP_AUTH_URL
          description: "commercetools Auth URL Test"
          required: true
          default: "https://auth.europe-west1.gcp.commercetools.com"
        - key: CTP_API_URL
          description: "commercetools API URL Test"
          required: true
          default: "https://api.europe-west1.gcp.commercetools.com"
        - key: CTP_SESSION_URL
          description: "commercetools Session URL Test"
          required: true
          default: "https://session.europe-west1.gcp.commercetools.com"
        - key: CTP_JWKS_URL
          description: "JWKs url"
          required: true
          default: "https://mc-api.europe-west1.gcp.commercetools.com/.well-known/jwks.json"
        - key: CTP_JWT_ISSUER
          description: "JWT Issuer for jwt validation"
          required: true
          default: "https://mc-api.europe-west1.gcp.commercetools.com"
        - key: NOVALNET_PUBLIC_KEY
          description: Novalnet Public Key
          required: true
        - key: NOVALNET_TARIFF_KEY
          description: Novalnet Tariff ID
          required: true
        - key: NOVALNET_CLIENT_KEY
          description: Novalnet client key
          required: true
        - key: NOVALNET_WEBHOOK_TEST_MODE
          description: Novalnet webhook Test mode for webhook notifications (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_INVOICE_TEST_MODE
          description: Enable test mode for Invoice payments (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_INVOICE_DUE_DATE
          description: Due date in days for Invoice payments (Default=14, Min=7)
          required: false
          default: "14"
        - key: NOVALNET_INVOICE_PAYMENT_ACTION
          description: Payment action for Invoice (payment/authorize)
          required: true
        - key: NOVALNET_INVOICE_PAYMENT_ACTION_MINIMUM_AMOUNT
          description: Minimum transaction amount for authorization (in minimum unit of currency. E.g. enter 100 which is equal to 1.00)
        - key: NOVALNET_GUARANTEED_INVOICE_TEST_MODE
          description: Enable test mode for Guarantee Invoice payments (1=Test, 0=Live)
          default: "0"
          required: false
        - key: NOVALNET_GUARANTEED_INVOICE_FORCE_NON_GUARANTEED_PAYMENT
          description: Even if payment guarantee is enabled, payments will still be processed as non-guarantee payments if the payment guarantee requirements are not met. Review the requirements under "Enable Payment Guarantee" in the Installation Guide. (1=Enable, 0=Disable)
          required: false
          default: "0"
        - key: NOVALNET_GUARANTEED_INVOICE_PAYMENT_ACTION
          description: Payment action for Guarantee Invoice (payment/authorize)
          required: true
        - key: NOVALNET_GUARANTEED_INVOICE_PAYMENT_ACTION_MINIMUM_AMOUNT
          description: Minimum transaction amount for authorization (in minimum unit of currency. E.g. enter 100 which is equal to 1.00)
          required: false
        - key: NOVALNET_GUARANTEED_SEPA_TEST_MODE
          description: Enable test mode for Guarantee Sepa payments (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_GUARANTEED_SEPA_FORCE_NON_GUARANTEED_PAYMENT
          description: Even if payment guarantee is enabled, payments will still be processed as non-guarantee payments if the payment guarantee requirements are not met. Review the requirements under "Enable Payment Guarantee" in the Installation Guide. (1=Enable, 0=Disable)
          required: false
          default: "0"
        - key: NOVALNET_GUARANTEED_SEPA_PAYMENT_ACTION
          description: Payment action for Guarantee SEPA (payment/authorize)
          required: true
        - key: NOVALNET_GUARANTEED_SEPA_PAYMENT_ACTION_MINIMUM_AMOUNT
          description: Minimum transaction amount for authorization (in minimum unit of currency. E.g. enter 100 which is equal to 1.00)
          required: false
        - key: NOVALNET_PREPAYMENT_TEST_MODE
          description: Enable test mode for Prepayment (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_PREPAYMENT_DUE_DATE
          description: Due date in days for Prepayment (Default=14, Min=7, Max=28)
          required: false
          default: "14"
        - key: NOVALNET_SEPA_TEST_MODE
          description: Enable test mode for SEPA (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_SEPA_DUE_DATE
          description: Due date in days for SEPA (Default=3, Min=3, Max=7)
          required: false
          default: "3"
        - key: NOVALNET_SEPA_PAYMENT_ACTION
          description: Payment action for SEPA (payment/authorize)
          required: true
        - key: NOVALNET_SEPA_PAYMENT_ACTION_MINIMUM_AMOUNT
          description: Minimum transaction amount for authorization (in minimum unit of currency. E.g. enter 100 which is equal to 1.00)
          required: false
        - key: NOVALNET_CREDITCARD_TEST_MODE
          description: Enable test mode for Creditcard (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_CREDITCARD_PAYMENT_ACTION
          description: Payment action for Creditcard (payment/authorize)
          required: true
        - key: NOVALNET_CREDITCARD_PAYMENT_ACTION_MINIMUM_AMOUNT
          description: Minimum transaction amount for authorization (in minimum unit of currency. E.g. enter 100 which is equal to 1.00)
          required: false
        - key: NOVALNET_CREDITCARD_ENFORCE_3D_SECURE_PAYMENT_OUTSIDE_EU
          description: By enabling this option, all payments from cards issued outside the EU will be authenticated via 3DS 2.0 SCA (1=Enable, 0=Disable)
          required: false
          default: "0"
        - key: NOVALNET_CREDITCARD_DISPLAY_INLINE_CREDITCARD_FORM
          description: The following fields will be shown in the checkout in two lines`:` card holder & credit card number/expiry date / CVC (1=Enable, 0=Disable)
          required: false
          default: "0"
        - key: NOVALNET_ACH_TEST_MODE
          description: Enable test mode for ACH (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_MULTIBANCO_TEST_MODE
          description: Enable test mode for Multibanco (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_ALIPAY_TEST_MODE
          description: Enable test mode for Alipay (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_BANCONTACT_TEST_MODE
          description: Enable test mode for Bancontact (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_BLIK_TEST_MODE
          description: Enable test mode for BLik (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_EPS_TEST_MODE
          description: Enable test mode for EPS (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_MBWAY_TEST_MODE
          description: Enable test mode for Mbway (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_ONLINE_BANK_TRANSFER_TEST_MODE
          description: Enable test mode for Online Bank Transfer (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_PAYPAL_TEST_MODE
          description: Enable test mode for PayPal (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_POSTFINANCE_TEST_MODE
          description: Enable test mode for PostFinance (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_POSTFINANCE_CARD_TEST_MODE
          description: Enable test mode for PostFinance card (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_PRZELEWY24_TEST_MODE
          description: Enable test mode for Przelewy24 (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_TRUSTLY_TEST_MODE
          description: Enable test mode for Trustly (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_TWINT_TEST_MODE
          description: Enable test mode for Twint (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_WECHATPAY_TEST_MODE
          description: Enable test mode for WeChatPay (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_PIX_TEST_MODE
          description: Enable test mode for PIX (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_BOLETO_TEST_MODE
          description: Enable test mode for Boleto (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_BIZUM_TEST_MODE
          description: Enable test mode for Bizum (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_BANCOMAT_TEST_MODE
          description: Enable test mode for BANCOMAT Pay (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_KAKAOPAY_TEST_MODE
          description: Enable test mode for Kakao Pay (1=Test, 0=Live)
          required: false
          default: "0"
        - key: NOVALNET_NAVERPAY_TEST_MODE
          description: Enable test mode for Naver Pay (1=Test, 0=Live)
          required: false
          default: "0"
        - key: MERCHANT_RETURN_URL
          description: Merchant return URL for payment completion
          required: false
      securedConfiguration:
        - key: NOVALNET_PRIVATE_KEY
          description: Novalnet Access Key for API authentication
          required: true
        - key: CTP_CLIENT_SECRET
          description: "commercetools client secret"
          required: true
